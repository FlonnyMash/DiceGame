<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Dice Poker</title>
    <!-- dice-poker-template-v7 -->
    <link rel="preload" href="Build/{{{ LOADER_FILENAME }}}" as="script">
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      :root {
        --design-w: 1080;
        --design-h: 720;
        --design-aspect: calc(var(--design-w) / var(--design-h));
        --bar-height: 64px;
        --accent: #e8b84a;
        --bg: #1a1a1a;
        --bar-bg: #121212;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
        font-family: system-ui, "Segoe UI", -apple-system, sans-serif;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      #player {
        display: grid;
        grid-template-rows: 1fr var(--bar-height);
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
      }

      #stage {
        position: relative;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        overflow: hidden;
      }

      #unity-canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
        outline: none;
      }

      #toolbar {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: var(--bar-height);
        padding: 8px 16px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        background: var(--bar-bg);
        border-top: 1px solid rgba(232, 184, 74, 0.3);
      }

      #toolbar[hidden] {
        display: none;
      }

      #fs-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 48px;
        min-height: 48px;
        padding: 0;
        border: 1px solid rgba(232, 184, 74, 0.5);
        border-radius: 12px;
        background: rgba(30, 30, 30, 0.95);
        color: var(--accent);
        cursor: pointer;
        touch-action: manipulation;
      }

      #fs-toggle:active {
        background: rgba(50, 50, 50, 0.95);
      }

      #fs-toggle svg {
        width: 24px;
        height: 24px;
        display: block;
        pointer-events: none;
      }

      /* iOS / fallback: viewport-filling layout without native Fullscreen API */
      html.player-expanded,
      html.player-expanded body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      html.player-expanded #player {
        position: fixed;
        inset: 0;
        height: 100dvh;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          0
          env(safe-area-inset-left, 0px);
      }

      html.player-expanded #toolbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        border-top: none;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: radial-gradient(ellipse at center, #2a2a2a 0%, var(--bg) 70%);
        color: #f0f0f0;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      #loading.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #loading h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      #loading-bar {
        width: min(320px, 85vw);
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }

      #loading-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #c9922e, var(--accent));
        border-radius: 999px;
        transition: width 0.12s ease-out;
      }

      #loading-label {
        margin: 0;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <h1>Dice Poker</h1>
      <div id="loading-bar" aria-hidden="true"><div id="loading-fill"></div></div>
      <p id="loading-label">Spiel wird geladen…</p>
    </div>

    <div id="player">
      <div id="stage">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
      </div>
      <footer id="toolbar" hidden>
        <button id="fs-toggle" type="button" aria-pressed="false" aria-label="Vollbild">
          <span id="fs-icon" aria-hidden="true"></span>
        </button>
      </footer>
    </div>

    <script>
      (function () {
        "use strict";

        var DESIGN_ASPECT = 1080 / 720;
        var ICON_ENTER = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3\"/></svg>";
        var ICON_EXIT = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3\"/></svg>";

        var canvas = document.getElementById("unity-canvas");
        var stage = document.getElementById("stage");
        var toolbar = document.getElementById("toolbar");
        var fsToggle = document.getElementById("fs-toggle");
        var fsIcon = document.getElementById("fs-icon");
        var loading = document.getElementById("loading");
        var loadingFill = document.getElementById("loading-fill");
        var loadingLabel = document.getElementById("loading-label");

        var gameReady = false;
        var layoutTimer = null;

        var isIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent)
          || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isMobile = isIOS
          || /Android/i.test(navigator.userAgent)
          || (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);

        function getDpr() {
          var dpr = window.devicePixelRatio || 1;
          return isMobile ? Math.min(dpr, 1.5) : Math.min(dpr, 2);
        }

        function fitCanvas() {
          if (!stage || !canvas) return;
          var sw = stage.clientWidth;
          var sh = stage.clientHeight;
          if (sw < 1 || sh < 1) return;

          var shellAspect = sw / sh;
          var w, h;
          if (shellAspect > DESIGN_ASPECT) {
            h = sh;
            w = Math.floor(h * DESIGN_ASPECT);
          } else {
            w = sw;
            h = Math.floor(w / DESIGN_ASPECT);
          }

          canvas.style.width = w + "px";
          canvas.style.height = h + "px";

          if (gameReady) {
            window.dispatchEvent(new Event("resize"));
          }
        }

        function scheduleLayout() {
          clearTimeout(layoutTimer);
          layoutTimer = setTimeout(fitCanvas, 50);
        }

        if (window.ResizeObserver && stage) {
          new ResizeObserver(scheduleLayout).observe(stage);
        }
        window.addEventListener("resize", scheduleLayout);
        window.addEventListener("orientationchange", scheduleLayout);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scheduleLayout);
        }

        function nativeFullscreenElement() {
          return document.fullscreenElement
            || document.webkitFullscreenElement
            || document.mozFullScreenElement
            || document.msFullscreenElement
            || null;
        }

        function requestNativeFullscreen(el) {
          var fn = el.requestFullscreen
            || el.webkitRequestFullscreen
            || el.mozRequestFullScreen
            || el.msRequestFullscreen;
          if (!fn) return Promise.reject(new Error("Fullscreen API not supported"));
          return Promise.resolve(fn.call(el));
        }

        function exitNativeFullscreen() {
          if (!nativeFullscreenElement()) return Promise.resolve();
          var fn = document.exitFullscreen
            || document.webkitExitFullscreen
            || document.mozCancelFullScreen
            || document.msExitFullscreen;
          return fn ? Promise.resolve(fn.call(document)) : Promise.resolve();
        }

        function isExpanded() {
          return document.documentElement.classList.contains("player-expanded");
        }

        function enterExpanded() {
          document.documentElement.classList.add("player-expanded");
          if (isMobile) {
            window.scrollTo(0, 1);
            setTimeout(function () { window.scrollTo(0, 0); }, 100);
          }
          scheduleLayout();
        }

        function exitExpanded() {
          document.documentElement.classList.remove("player-expanded");
          scheduleLayout();
        }

        function isFullscreen() {
          return !!nativeFullscreenElement() || isExpanded();
        }

        function enterFullscreen() {
          if (isFullscreen()) return Promise.resolve();

          if (isIOS) {
            enterExpanded();
            return Promise.resolve();
          }

          return requestNativeFullscreen(document.documentElement)
            .catch(function () { return requestNativeFullscreen(canvas); })
            .catch(function () { enterExpanded(); })
            .then(scheduleLayout);
        }

        function exitFullscreen() {
          if (nativeFullscreenElement()) {
            return exitNativeFullscreen().then(scheduleLayout);
          }
          if (isExpanded()) {
            exitExpanded();
          }
          return Promise.resolve();
        }

        function toggleFullscreen() {
          return isFullscreen() ? exitFullscreen() : enterFullscreen();
        }

        function updateFsButton() {
          var on = isFullscreen();
          fsIcon.innerHTML = on ? ICON_EXIT : ICON_ENTER;
          fsToggle.setAttribute("aria-pressed", on ? "true" : "false");
          fsToggle.setAttribute("aria-label", on ? "Vollbild beenden" : "Vollbild");
        }

        window.dicePokerFullscreen = {
          enter: enterFullscreen,
          toggle: toggleFullscreen,
          isActive: isFullscreen,
          usesPseudoFullscreen: function () { return isIOS || isExpanded(); }
        };

        fsToggle.addEventListener("click", function () {
          toggleFullscreen()
            .then(updateFsButton)
            .catch(function (err) { console.warn("[Dice Poker]", err); });
        });

        ["fullscreenchange", "webkitfullscreenchange"].forEach(function (evt) {
          document.addEventListener(evt, function () {
            updateFsButton();
            scheduleLayout();
          });
        });

        function setProgress(p) {
          var pct = Math.round(p * 100);
          loadingFill.style.width = pct + "%";
          if (p < 0.25) loadingLabel.textContent = "Daten werden geladen…";
          else if (p < 0.6) loadingLabel.textContent = "Engine wird gestartet…";
          else if (p < 0.95) loadingLabel.textContent = "Fast fertig…";
          else loadingLabel.textContent = "Bereit.";
        }

        function onGameReady() {
          gameReady = true;
          toolbar.hidden = false;
          loading.classList.add("done");
          scheduleLayout();
          updateFsButton();
        }

        var buildUrl = "Build";
        var config = {
          dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
          frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
          codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "{{{ COMPANY_NAME }}}",
          productName: "{{{ PRODUCT_NAME }}}",
          productVersion: "{{{ PRODUCT_VERSION }}}",
          matchWebGLToCanvasSize: true,
          devicePixelRatio: getDpr()
        };

        setProgress(0);
        scheduleLayout();
        updateFsButton();

        var loader = document.createElement("script");
        loader.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        loader.onload = function () {
          loadingLabel.textContent = "Initialisierung…";
          createUnityInstance(canvas, config, function (progress) {
            setProgress(progress);
            if (progress > 0.05) scheduleLayout();
          }).then(function () {
            setProgress(1);
            onGameReady();
          }).catch(function (msg) {
            loadingLabel.textContent = "Laden fehlgeschlagen.";
            alert(msg);
          });
        };
        loader.onerror = function () {
          loadingLabel.textContent = "Loader konnte nicht geladen werden.";
        };
        document.body.appendChild(loader);
      })();
    </script>
  </body>
</html>
